name: Check buses

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bus-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check buses every 30s for ~4.5 minutes
        env:
          WMATA_API_KEY: ${{ secrets.WMATA_API_KEY }}
        run: |
          for i in $(seq 1 9); do
            python3 check.py
            sleep 30
          done

      - name: Commit updated state
        run: |
          git config user.name "bus-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ configs/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Update notification state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
